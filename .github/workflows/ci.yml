name: CI Front

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build